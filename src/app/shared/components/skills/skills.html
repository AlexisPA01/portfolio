<section class="skills">
    <div class="skills__container">
        <header class="skills__header">
            <p class="skills__subtitle">Tecnologías</p>
            <h2 class="skills__title">Skills</h2>
            <p class="skills__description">
                Tecnologías y herramientas con las que trabajo
                para desarrollar soluciones web.
            </p>
        </header>
        <div class="skills__categories">
            @for (category of skillCategories; track category.title) {

            <app-skill-category [title]="category.title" [icon]="category.icon" [skills]="category.skills">
            </app-skill-category>

            }
        </div>
    </div>
</section>
